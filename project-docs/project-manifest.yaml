code_intel:              # advisory only -- never changes the audit verdict (audit.ps1 §4)
  impact_status: not_applicable   # this repo has no statically-reachable automated tests
  impact_reason: "the C++ sources have no in-process unit tests; regression is carried by the socket harnesses under test_gate.suites, which are runtime/harness probes rather than statically-reachable code paths"
test_gate:                # regression registry -- interpreted by pipeline/test.ps1 via scripts/test-gate.py
  # All ten suites share ONE server port (5000), ONE database (mydb) and ONE runtime tree
  # (Server/filesys, from connect.config line 3 = "./filesys", which is cwd-relative and MUST
  # stay CRLF -- LF makes dist/Server.exe die at startup). They are therefore NOT parallel_safe
  # and the gate serializes them.
  #
  # Known hazard, RESOLVED on 2026-10-03 (FINDING-GATE-1): all suites killed the server with
  # `taskkill /F /IM Server.exe` -- by IMAGE NAME, which reaches every other suite's process and
  # is indistinguishable from a product crash. It produced three separate "the server died"
  # findings, every one of them another suite's kill. They now share
  # project-docs/evidence/_harness/server_ctl.py, which tracks the PID it started and refuses
  # to kill anything else; a busy port is reported, not blindly cleared.
  #
  # REMAINING blocker for `enforced` -- FINDING-GATE-2: the harnesses still do not own the whole
  # server lifecycle. unique_login_e2e.py additionally requires a binary at
  # build/build-Server/release/Server.exe, which does not exist in the main worktree (it was
  # built inside a detached test worktree). Verified pre-existing, not caused by the PID
  # cleanup: the unmodified suite fails the same way. Its 16 assertions are therefore counted
  # as declared, not as green here.
  status: waived          # pending -> enforced once FINDING-GATE-2 is closed
  owner: user
  date: 2026-10-03
  reason: >
    Ten socket harnesses (369 declared assertions) carry this project's regression, but they do
    not yet own the whole server lifecycle: unique_login_e2e.py needs a binary that the main
    worktree does not build (FINDING-GATE-2). Declared here so the set is checkable and
    auditable rather than living as ten unregistered scripts. Flip to `enforced` after
    FINDING-GATE-2 closes.
  suites:
    - id: sec001
      cmd: ["py", "-3.13", "project-docs/evidence/REQ-EXT-SEC-001/verify.py"]
      cwd: "."
      asserts: 48
      timeout_s: 300
      blocking: true
      owner: REQ-EXT-SEC-001
      added: 2026-09-29
      note: "security baseline. BASE falls back to the literal E:/qt/xiangmu when SEC001_BASE is unset -- see FINDING-GATE-3. D5-adapted IN PLACE on 2026-10-03: its four storage-model assertions (K1c/K1f/K1i-or-K2a/K2b) now read the DB fact layer instead of the filesystem, so this file is NO LONGER byte-identical to its original -- the earlier 'original stays byte-identical' position is retired. It gained a mysql CLI dependency (SEC001_MYSQL / SEC001_DB overridable) and still does not self-start the server. Protocol and security assertions are untouched"
      isolation: {port: 5000, db: mydb, filesys: "./Server/filesys", kill_policy: pid_only, parallel_safe: false, extra: "mysql CLI at SEC001_MYSQL"}
    - id: sec001-regression
      cmd: ["py", "-3.13", "project-docs/evidence/REQ-EXT-FILE-001/sec001_regression.py"]
      cwd: "."
      asserts: 48
      timeout_s: 300
      blocking: true
      owner: REQ-EXT-FILE-001
      added: 2026-09-30
      note: "D5-adapted copy of sec001. Historically this was the ONLY adapted copy while the original kept its assertions; since 2026-10-03 the original was adapted in place too, so the two now carry equivalent storage-model assertions and this suite is redundant-but-retained as the self-starting variant"
      isolation: {port: 5000, db: mydb, filesys: "./Server/filesys", kill_policy: pid_only, parallel_safe: false}
    - id: entry-ops
      cmd: ["py", "-3.13", "project-docs/evidence/REQ-EXT-FILE-001/entry_ops_e2e.py"]
      cwd: "."
